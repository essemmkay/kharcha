name: Nightly DB backup

# Logical backup of the Supabase Postgres database. Runs on a free GitHub
# Actions cron and uploads a gzipped dump as a build artifact (retained 90
# days). Set the repository secret DIRECT_URL to the Supabase direct
# connection string (port 5432). Trigger manually from the Actions tab too.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres 16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          test -n "$DIRECT_URL" || { echo "DIRECT_URL secret is not set"; exit 1; }
          pg_dump --no-owner --no-privileges "$DIRECT_URL" | gzip > "kharcha-backup-$(date +%Y%m%d).sql.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-db-backup
          path: kharcha-backup-*.sql.gz
          retention-days: 90
